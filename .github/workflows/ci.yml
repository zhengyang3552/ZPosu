on: [push, pull_request]
name: Continuous Integration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)
  security-events: write # for reporting InspectCode issues

jobs:
  inspect-code:
    name: Code Quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu.Desktop.slnf

      - name: Restore inspectcode cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/inspectcode
          key: inspectcode-${{ hashFiles('.config/dotnet-tools.json', '.github/workflows/ci.yml', 'osu.sln*', 'osu*.slnf', '.editorconfig', '.globalconfig', 'CodeAnalysis/*', '**/*.csproj', '**/*.props') }}

      - name: Dotnet code style
        run: dotnet build -c Debug -warnaserror osu.Desktop.slnf -p:EnforceCodeStyleInBuild=true

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.12
        with:
          # this is WTF tier but if you don't specify *both* of these the defaults assume `build: true`
          build: false
          no-build: true
          tool-version: '2026.2.1'
          solution: ./osu.Desktop.slnf
          caches-home: inspectcode
          verbosity: WARN

  windows-build:
    name: Windows build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish osu.Desktop/osu.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Check that the bundled LLin plugin made it into the output
        shell: bash
        run: |
          for f in osu.Game.Rulesets.Hikariii.dll LLin.OSIntegrations.dll M.Resources.dll zh/M.Resources.resources.dll; do
            if [ ! -f "publish/$f" ]; then
              echo "::error::bundled plugin file missing from publish output: $f"
              exit 1
            fi
          done
          echo "bundled LLin plugin present in publish output."

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: ZPosu-win-x64
          path: publish/
